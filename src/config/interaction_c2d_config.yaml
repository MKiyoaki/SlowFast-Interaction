TRAIN:
  ENABLE: False
  DATASET: Interaction
  BATCH_SIZE: 16
  EVAL_PERIOD: 10
  CHECKPOINT_PERIOD: 5
  AUTO_RESUME: True
DATA:
  NUM_FRAMES: 8
  SAMPLING_RATE: 8
  TRAIN_JITTER_SCALES: [256, 320]
  TRAIN_CROP_SIZE: 112  # 224
  TEST_CROP_SIZE: 128 # 256
  INPUT_CHANNEL_NUM: [3]
  MULTI_LABEL: True
  PATH_TO_DATA_DIR: "/media/kiyoaki/Ventoy/projects/SlowFast-Interaction/data/interaction/clip/2022/w1"
RESNET:
  ZERO_INIT_FINAL_BN: True
  WIDTH_PER_GROUP: 64
  NUM_GROUPS: 1
  DEPTH: 18
  TRANS_FUNC: bottleneck_transform
  STRIDE_1X1: False
  # NUM_BLOCK_TEMP_KERNEL: [[3], [4], [6], [3]] # For ResNet50
  NUM_BLOCK_TEMP_KERNEL: [[2], [2], [2], [2]]
NONLOCAL:
  LOCATION: [[[]], [[]], [[]], [[]]]
  GROUP: [[1], [1], [1], [1]]
  INSTANTIATION: softmax
BN:
  USE_PRECISE_STATS: True
  NUM_BATCHES_PRECISE: 200
SOLVER:
  BASE_LR: 1e-1
  LR_POLICY: cosine
  MAX_EPOCH: 10
  MOMENTUM: 0.9
  WEIGHT_DECAY: 1e-4
  WARMUP_EPOCHS: 24.0
  WARMUP_START_LR: 0.01
  OPTIMIZING_METHOD: sgd
  CLIP_GRAD_VAL: True
MODEL:
  NUM_CLASSES: 5
  ARCH: c2d
  MODEL_NAME: ResNet
  LOSS_FUNC: bce_logit
  DROPOUT_RATE: 0.5
TEST:
  ENABLE: False
  DATASET: Interaction
  BATCH_SIZE: 16
DATA_LOADER:
  NUM_WORKERS: 1
  PIN_MEMORY: True
NUM_GPUS: 1
NUM_SHARDS: 1
RNG_SEED: 0
OUTPUT_DIR: "../outputs/w1/c2d"

TENSORBOARD:
  ENABLE: True
  CLASS_NAMES_PATH: "../src/config/class_id.json"
  MODEL_VIS:
    ENABLE: True
    MODEL_WEIGHTS: False # Set to True to visualize model weights.
    ACTIVATIONS: False # Set to True to visualize feature maps.
    INPUT_VIDEO: False # Set to True to visualize the input video(s) for the corresponding feature maps.
    LAYER_LIST: ['s5'] # List of layer names to visualize weights and activations for.
    GRAD_CAM:
      ENABLE: False
      LAYER_LIST: ['s5'] # List of CNN layers to use for Grad-CAM visualization method. # The number of layer must be equal to the number of pathway(s).
