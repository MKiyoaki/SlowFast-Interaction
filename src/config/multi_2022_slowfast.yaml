TRAIN:
  ENABLE: True
  DATASET: Interaction
  BATCH_SIZE: 48
  EVAL_PERIOD: 5
  CHECKPOINT_PERIOD: 5
  AUTO_RESUME: True
DATA:
  NUM_FRAMES: 4
  SAMPLING_RATE: 2
  TRAIN_JITTER_SCALES: [256, 320]
  TRAIN_CROP_SIZE: 224
  TEST_CROP_SIZE: 256
  INPUT_CHANNEL_NUM: [3, 3]
  MULTI_LABEL: True
  PATH_TO_DATA_DIR: "/media/kiyoaki/Ventoy/projects/SlowFast-Interaction/data/interaction/clip/2022/csv/wall"
SLOWFAST:
  ALPHA: 4
  BETA_INV: 8
  FUSION_CONV_CHANNEL_RATIO: 2
  FUSION_KERNEL_SZ: 7
RESNET:
  ZERO_INIT_FINAL_BN: True
  WIDTH_PER_GROUP: 64 # 32
  NUM_GROUPS: 1
  DEPTH: 18
  TRANS_FUNC: bottleneck_transform
  STRIDE_1X1: False
  # NUM_BLOCK_TEMP_KERNEL: [[3, 3], [4, 4], [6, 6], [3, 3]]
  NUM_BLOCK_TEMP_KERNEL: [ [ 2, 2 ], [ 2, 2 ], [ 2, 2 ], [ 2, 2 ] ]
  SPATIAL_STRIDES: [[1, 1], [2, 2], [2, 2], [2, 2]]
  SPATIAL_DILATIONS: [[1, 1], [1, 1], [1, 1], [1, 1]]
NONLOCAL:
  LOCATION: [[[], []], [[], []], [[], []], [[], []]]
  GROUP: [[1, 1], [1, 1], [1, 1], [1, 1]]
  INSTANTIATION: dot_product
BN:
  USE_PRECISE_STATS: False
  NUM_BATCHES_PRECISE: 200
SOLVER:
  BASE_LR: 3e-3
  LR_POLICY: cosine
  MAX_EPOCH: 10
  MOMENTUM: 0.9
  WEIGHT_DECAY: 1e-4
  WARMUP_EPOCHS: 1.0
  WARMUP_START_LR: 3e-4
  OPTIMIZING_METHOD: adam
MODEL:
  NUM_CLASSES: 2
  ARCH: slowfast
  MODEL_NAME: SlowFast
  LOSS_FUNC: bce_logit
  DROPOUT_RATE: 0.5
TEST:
  ENABLE: True
  DATASET: Interaction
  BATCH_SIZE: 128
DATA_LOADER:
  NUM_WORKERS: 16
  PIN_MEMORY: True
NUM_GPUS: 1
NUM_SHARDS: 1
RNG_SEED: 0
OUTPUT_DIR: "../outputs/interaction/2022/w4/slowfast/multi/1_pre"
TENSORBOARD:
  ENABLE: True
  CLASS_NAMES_PATH: "../src/config/names/class_id_2022.json"
  MODEL_VIS:
    ENABLE: True
    MODEL_WEIGHTS: False
    ACTIVATIONS: False
    INPUT_VIDEO: False
    LAYER_LIST: ['s5','s4_fuse'] # List of layer names to visualize weights and activations for.
    GRAD_CAM:
      ENABLE: True
      USE_TRUE_LABEL: False
      OUTPUT_DIR: "../outputs/interaction/2022/w4/slowfast/multi/1_pre/grad_cam"
      LAYER_LIST: ['s5', 's4_fuse'] # The number of layer must be equal to the number of pathway(s).
