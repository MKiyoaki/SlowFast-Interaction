TRAIN:
  ENABLE: True
  DATASET: Interaction
  BATCH_SIZE: 32
  EVAL_PERIOD: 2
  CHECKPOINT_PERIOD: 2
  AUTO_RESUME: True
DATA:
  NUM_FRAMES: 2
  SAMPLING_RATE: 8
  TRAIN_JITTER_SCALES: [256, 320]
  TRAIN_CROP_SIZE: 224
  TEST_CROP_SIZE: 256
  INPUT_CHANNEL_NUM: [3]
  MULTI_LABEL: True
  PATH_TO_DATA_DIR: "/media/kiyoaki/Ventoy/projects/SlowFast-Interaction/data/interaction/clip/2022/w1"
RESNET:
  ZERO_INIT_FINAL_BN: True
  WIDTH_PER_GROUP: 64
  NUM_GROUPS: 1
  DEPTH: 18
  TRANS_FUNC: bottleneck_transform
  STRIDE_1X1: False
  # NUM_BLOCK_TEMP_KERNEL: [[3], [4], [6], [3]]
  NUM_BLOCK_TEMP_KERNEL: [ [ 2 ], [ 2 ], [ 2 ], [ 2 ] ]
NONLOCAL:
  LOCATION: [[[]], [[1, 3]], [[1, 3, 5]], [[]]]
  GROUP: [[1], [1], [1], [1]]
  INSTANTIATION: softmax
BN:
  USE_PRECISE_STATS: True
  NUM_BATCHES_PRECISE: 200
SOLVER:
  BASE_LR: 1e-2
  LR_POLICY: cosine
  MAX_EPOCH: 10
  MOMENTUM: 0.9
  WEIGHT_DECAY: 1e-4
  WARMUP_EPOCHS: 1.0
  WARMUP_START_LR: 1e-3
  OPTIMIZING_METHOD: adam
MODEL:
  NUM_CLASSES: 1
  ARCH: c2d
  MODEL_NAME: ResNet
  LOSS_FUNC: bce_logit
  DROPOUT_RATE: 0.5
TEST:
  ENABLE: True
  DATASET: Interaction
  BATCH_SIZE: 32
DATA_LOADER:
  NUM_WORKERS: 8
  PIN_MEMORY: True
NUM_GPUS: 1
NUM_SHARDS: 1
RNG_SEED: 0
OUTPUT_DIR: "../outputs/interaction/2022/w1/c2d/ua"
TENSORBOARD:
  ENABLE: True
  CLASS_NAMES_PATH: "../src/config/names/class_id_ua.json"
  MODEL_VIS:
    ENABLE: True
    MODEL_WEIGHTS: False
    ACTIVATIONS: False
    INPUT_VIDEO: False
    LAYER_LIST: ['s5'] # List of layer names to visualize weights and activations for.
    GRAD_CAM:
      ENABLE: True
      USE_TRUE_LABEL: False
      # OUTPUT_DIR: "../outputs/w1/slowfast/grad_cam"
      LAYER_LIST: ['s5'] # The number of layer must be equal to the number of pathway(s).